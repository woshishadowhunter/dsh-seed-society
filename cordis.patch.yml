# dsh-seed-society bundle patch — the layer a profile gets when this bundle is
# listed in `dsh.profile.bundles` (`dsh plugin add` does that).
#
# This bundle only INSERTS its own row. It deliberately does not override
# `llm-deepseek` or `dsh-mneme`: in the 0.2 loader an id-targeted patch
# replaces the whole `config` of that row (no deep merge), so overriding a
# package that this plugin does not own either discards that package's own
# settings or warns `patch: entry "<id>" not found` when it is absent.
# Memory behaviour now belongs to whoever configures mneme (its own defaults
# plus the profile's patch layer); see integrations/dsh/README.md.
#
# MCP society bridge — exposes the seed-society runtime to the harness model as
# mcp__society__* tools (run/enqueue/status/knowledge/genome/experience/
# approve/self-test...). Requires the Python package:
#   python -m pip install seed-society
# (install-plugin.ps1 does this). SOCIETY_PROJECT_DIR can point at a source
# checkout instead; PYTHONPATH is then derived from it.
- insert:
    - id: mcp-society
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: society
        transport: stdio
        command: python
        args:
          - '-m'
          - 'seed_society.mcp_server'
        env:
          SOCIETY_PROJECT_DIR: !!js 'process.env.SOCIETY_PROJECT_DIR || ""'
          PYTHONPATH: !!js 'process.env.SOCIETY_PROJECT_DIR ? process.env.SOCIETY_PROJECT_DIR + "/src" : (process.env.PYTHONPATH || "")'
        toolCallTimeoutMs: 300000
        failOnStartupError: false
        reconnect:
          enabled: true
          maxAttempts: 5
