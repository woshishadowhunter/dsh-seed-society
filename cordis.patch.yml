# dsh-seed-society bundle patch — applied automatically when this plugin
# is listed in a profile's `dsh.profile.bundles` (dsh plugin add does this).
#
# Policy (2026-09-10): ZERO mneme-initiated LLM calls. mneme's background
# consolidation (autoDream) and its session summarizer are both OFF; every
# LLM-triggering path mneme 0.7.x exposes is explicitly disabled below so a
# future default flip cannot silently re-enable one. Memory consolidation is
# owned by this project's deterministic engine instead:
#     seed-society consolidate GOAL --db society.db --mneme-dir ~/.dsh/memory
# It needs no model, cannot fail on provider quirks, and drives the same
# mneme importance gate (forgetting = injection stops).
#
# mneme is still used for the two capabilities that never call a model:
#   - autoInject: high-importance seeds enter session context
#   - the Markdown mirror: human-readable/editable memory sovereignty

# 1) llm-deepseek route default: reasoningEffort off sends thinking:disabled
#    for calls that do not pass an explicit effort. Explicit values from
#    agent-default-model still win per call.
- id: llm-deepseek
  config:
    reasoningEffort: off

# 2) dsh-mneme with every LLM path disabled.
- id: dsh-mneme
  config:
    memoryDir: ~/.dsh/memory
    # Injection + mirror stay on (no model involved).
    autoInject: true
    maxInjectedItems: 5
    importanceThreshold: 3
    # --- no-LLM policy: all four background model paths are OFF ---
    autoDream: false
    autoSummarize: false
    sleepModeEnabled: false
    entityExtractionEnabled: false
    # Kept explicit so re-enabling dream later is a one-line change; these
    # only take effect when autoDream is turned back on.
    dreamProvider: deepseek-official
    dreamModel: deepseek-chat
    dreamMaxTokens: 32768

# 3) MCP society bridge — exposes the seed-society runtime to the
#    harness model as mcp__society__* tools (run/enqueue/status/knowledge/
#    genome/experience/approve/self-test...). Requires the Python package:
#    pip install 'seed-society' (or run install-plugin.ps1 which does
#    it). SOCIETY_PROJECT_DIR can point at a source checkout instead.
- insert:
    - id: mcp-society
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: society
        transport: stdio
        command: python
        args:
          - '-m'
          - 'seed_society.mcp_server'
        env:
          SOCIETY_PROJECT_DIR: !!js 'process.env.SOCIETY_PROJECT_DIR || ""'
        toolCallTimeoutMs: 300000
        failOnStartupError: false
        reconnect:
          enabled: true
          maxAttempts: 5
